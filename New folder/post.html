<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل المقال - عدسة</title>
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../custom.css" />
  <script>
    if (!window.location.hash) {
      var params = new URLSearchParams(window.location.search);
      var slug = params.get('slug') || params.get('id');
      if (slug) {
        window.location.hash = '#/blog/' + slug;
      } else {
        window.location.hash = '#/blog';
      }
    }
  </script>
</head>
<body class="bg-[#0a0a0a] text-neutral-300 min-h-screen flex flex-col selection:bg-orange-500 selection:text-white">
  <div id="navbar-container"></div>
  <main id="main-content" class="flex-grow pt-20"></main>
  <div id="footer-container"></div>
  <div id="toast-container"></div>
  <script src="../posts-data.js"></script>
  <script src="../app.js"></script>
</body>
</html>
